<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">ZMS-PNG</title>
  <desc id="description">A compact personal workspace for AI applications and knowledge workflows, with connected learning paths in teal and gold.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1726"/>
      <stop offset="1" stop-color="#173746"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b0d0d3" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame">
      <rect width="720" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="360" fill="url(#background)"/>
    <rect width="720" height="360" fill="url(#grid)"/>
    <circle cx="700" cy="20" r="205" fill="none" stroke="#8ab7bf" stroke-opacity="0.08"/>
    <circle cx="700" cy="20" r="170" fill="none" stroke="#8ab7bf" stroke-opacity="0.055"/>

    <g font-family="'Segoe UI', Arial, sans-serif">
      <path d="M44 48H69" stroke="#e7bd82" stroke-width="3" stroke-linecap="round"/>
      <text x="83" y="55" fill="#b0c7ce" font-size="20" letter-spacing="3">PERSONAL WORKSPACE</text>
      <text x="40" y="163" fill="#f2f6f3" font-size="91" font-weight="700" letter-spacing="-3">ZMS-PNG</text>
      <text x="45" y="204" fill="#b8d1d6" font-size="24">AI applications &amp; knowledge workflows</text>
      <path d="M45 237H675" stroke="#789ca5" stroke-opacity="0.3"/>
      <text x="45" y="302" fill="#85d5ca" font-size="20" letter-spacing="2">LEARN</text>
      <text x="166" y="302" fill="#dce8e7" font-size="20" letter-spacing="2">BUILD</text>
      <text x="283" y="302" fill="#e7bd82" font-size="20" letter-spacing="2">CONNECT</text>
    </g>

    <path d="M479 301C507 301 509 271 536 271S579 301 606 301S643 267 671 267" fill="none" stroke="#85d5ca" stroke-width="3" stroke-linecap="round"/>
    <path d="M479 301C522 301 540 322 567 311S628 267 671 267" fill="none" stroke="#e7bd82" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/>
    <g fill="#132d3b" stroke="#85d5ca" stroke-width="3">
      <circle cx="479" cy="301" r="5"/>
      <circle cx="536" cy="271" r="5"/>
      <circle cx="606" cy="301" r="5"/>
      <circle cx="671" cy="267" r="5"/>
    </g>
    <circle cx="567" cy="311" r="4" fill="#e7bd82"/>
  </g>
</svg>
