      <text x="53" y="179" fill="#f2f6f3" font-size="88" font-weight="700" letter-spacing="-3">ZMS-PNG</text>
      <text x="58" y="224" fill="#b8d1d6" font-size="19" letter-spacing="1">AI applications &amp; knowledge workflows</text>
      <path d="M58 261H625" stroke="#789ca5" stroke-opacity="0.3"/>
      <text x="58" y="303" fill="#85d5ca" font-size="14" letter-spacing="2">LEARN</text>
