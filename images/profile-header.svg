      <text x="163" y="303" fill="#dce8e7" font-size="14" letter-spacing="2">BUILD</text>
      <circle cx="248" cy="298" r="2" fill="#789ca5"/>
      <text x="270" y="303" fill="#e7bd82" font-size="14" letter-spacing="2">CONNECT</text>
