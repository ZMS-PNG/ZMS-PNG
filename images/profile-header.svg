<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360" role="img" aria-labelledby="title description">
  <title id="title">ZMS-PNG</title>
  <desc id="description">A personal workspace for learning, building, and connecting knowledge. Two linked paths cross an open notebook on a deep blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1726"/>
      <stop offset="1" stop-color="#173746"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183c49"/>
      <stop offset="1" stop-color="#102331"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b0d0d3" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1240" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
