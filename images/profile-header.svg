    <rect width="1240" height="360" fill="url(#grid)"/>
    <circle cx="1156" cy="38" r="258" fill="none" stroke="#8ab7bf" stroke-opacity="0.08"/>
    <circle cx="1156" cy="38" r="218" fill="none" stroke="#8ab7bf" stroke-opacity="0.055"/>

